<title>AI Agent 学习图谱</title>
<style>
  :root {

    --ink: #1c1915;
    --muted: #5e584e;
    --line: #ddd4c4;
    --card: #fffcf7;
    --accent: #9a3412;
    --accent-soft: #f3e4d8;
    --teal: #0f5c57;
    --teal-soft: #e4f0ee;
    --gold: #7a5b24;
    --shadow: 0 1px 0 rgba(28, 25, 21, 0.04);

  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {

  button, input { font: inherit; color: inherit; }

  a { color: var(--teal); }
  .app { display: grid; grid-template-columns: 220px 1fr; min-height: 100%; }
  aside {

    padding: 28px 18px;
    border-right: 1px solid var(--line);
    background: #efeae0;
    display: flex; flex-direction: column; gap: 18px;
  }
  .brand { font-family: var(--serif); font-size: 22px; line-height: 1.25; letter-spacing: -0.02em; }
  .brand small { display: block; margin-top: 6px; font-family: var(--sans); font-size: 12px; color: var(--muted); font-weight: 400; letter-spacing: 0; }
  nav { display: flex; flex-direction: column; gap: 4px; }
  nav button {
    text-align: left; background: transparent; border: 0;
    padding: 8px 10px; border-radius: 8px; color: var(--muted);
  }
  nav button[aria-current="page"] { background: var(--card); color: var(--ink); box-shadow: var(--shadow); }
  .side-note { margin-top: auto; font-size: 12px; color: var(--muted); }
  .side-note p { margin: 8px 0 0; }
  main { padding: 28px 36px 64px; max-width: 1180px; min-width: 0; }
  header.top { display: flex; gap: 16px; align-items: flex-end; justify-content: space-between; margin-bottom: 22px; }
  h1 { font-family: var(--serif); font-weight: 500; font-size: 34px; margin: 0; letter-spacing: -0.03em; }
  .lede { color: var(--muted); margin: 6px 0 0; max-width: 640px; }
  input[type="search"] {

  .formula {
    display: grid; grid-template-columns: 1.3fr 1fr; gap: 16px; margin-bottom: 16px;

  .panel {

  .eq em { font-style: normal; color: var(--accent); }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  .chip {

    padding: 4px 10px; font-size: 13px; color: var(--muted);
  }
  .chip[aria-pressed="true"], .chip.active { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  h2 { font-family: var(--serif); font-weight: 500; font-size: 22px; margin: 22px 0 10px; }
  h3 { font-size: 15px; margin: 0 0 6px; }
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  .k { font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--gold); margin-bottom: 4px; }
  ul.clean { margin: 8px 0 0; padding-left: 18px; }
  ul.clean li { margin: 4px 0; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { color: var(--muted); font-weight: 500; font-size: 12px; }
  .map-wrap { display: grid; grid-template-columns: 1fr 280px 1fr; gap: 12px; align-items: start; }
  .wing { display: flex; flex-direction: column; gap: 8px; }
  .wing.right { text-align: right; }
  .node {
    background: var(--card); border: 1px solid var(--line); border-radius: 12px;
    padding: 10px 12px; text-align: left;
  }

  .node strong { display: block; font-size: 14px; }
  .node span { color: var(--muted); font-size: 12px; }
  .node[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
  .center-card {
    background: var(--ink); color: #f6f1e7; border-radius: 16px; padding: 22px 16px; text-align: center;
  }
  .center-card p { margin: 8px 0 0; font-family: var(--serif); font-size: 22px; line-height: 1.35; }
  .detail { margin-top: 14px; }
  .tree-tools { display: flex; gap: 8px; margin-bottom: 12px; }
  .ktree { overflow-x: auto; padding: 8px 4px 28px; }
  .kbranch { display: flex; flex-direction: row; align-items: center; flex: none; }
  .knode {
    display: inline-flex; align-items: center; gap: 8px; flex: none;
    background: var(--card); border: 1px solid var(--line); border-radius: 12px;
    padding: 7px 8px 7px 12px; max-width: 240px;
  }
  .kbody { min-width: 0; }
  .ktitle {
    display: flex; flex-direction: column; align-items: flex-start; gap: 1px;
    background: transparent; border: 0; padding: 0; text-align: left; min-width: 0;
  }
  .ktitle strong { font-size: 14px; line-height: 1.35; word-break: keep-all; }
  .ktitle span, .knode .src { color: var(--muted); font-size: 12px; }
  .knode .src { margin-top: 2px; }
  .kfold {
    width: 22px; height: 22px; flex: none; border-radius: 99px;
    border: 1px solid var(--line); background: var(--bg); color: var(--accent);
    padding: 0; line-height: 20px; position: relative; z-index: 1;
  }
  .d0 > .knode { background: var(--ink); color: #f6f1e7; border-color: var(--ink); }
  .d0 > .knode .ktitle span, .d0 > .knode .src { color: #e7c7a4; }
  .d0 > .knode .kfold { background: #f6f1e7; color: var(--ink); border-color: transparent; }
  .d1 > .knode { background: #fbf6ef; }
  .d3 > .knode, .d4 > .knode { background: var(--teal-soft); border-color: transparent; }
  .kbranch > ul {
    display: flex; flex-direction: row; align-items: center; flex: none;
    list-style: none; gap: 8px; margin: 0 0 0 18px; padding: 0; position: relative;
  }
  .kbranch > ul::before {
    content: ""; position: absolute; left: -18px; top: 50%; width: 18px; border-top: 1.5px solid #c3b9a6;
  }
  .kbranch > ul > li { display: flex; flex: none; padding: 0; }
  .preview { position: fixed; inset: 0; z-index: 40; background: rgba(28, 25, 21, .35); display: flex; justify-content: flex-end; }

  .preview-bar strong { font-family: var(--serif); font-size: 20px; font-weight: 500; }
  .preview-close { border: 1px solid var(--line); background: var(--card); border-radius: 999px; padding: 4px 12px; }
  .preview-body { font-size: 15px; }
  .preview-body h1, .preview-body h2, .preview-body h3, .preview-body h4 { font-family: var(--serif); font-weight: 500; scroll-margin-top: 64px; }
  .preview-body h1 { font-size: 28px; }
  .preview-body h2 { font-size: 22px; margin-top: 28px; }
  .preview-body h3, .preview-body h4 { font-size: 18px; }
  .preview-body .hit { background: var(--accent-soft); border-radius: 8px; padding: 4px 8px; }
  .preview-body img { max-width: 100%; height: auto; }
  .preview-body pre { overflow: auto; background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 12px; }
  .preview-body code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; }

  .preview-body table { display: block; overflow-x: auto; }
  .points { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }

.point-list { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
.point-list a, a.src { text-decoration: none; }
.point-list a { display: block; background: var(--teal-soft); color: var(--teal); border-radius: 8px; padding: 8px 10px; }
.point-list a small, a.src { display: block; margin-top: 3px; color: var(--gold); font-size: 12px; }
a.src { margin-top: 10px; }
  svg.graph { width: 100%; height: auto; background: var(--card); border: 1px solid var(--line); border-radius: 14px; }
  svg.graph text { font-family: var(--sans); font-size: 13px; }
  svg.graph .n { cursor: pointer; }
  svg.graph .n rect { fill: #fffcf7; stroke: #cfc6b6; }
  svg.graph .n.core rect { fill: #1c1915; stroke: #1c1915; }
  svg.graph .n.core text { fill: #f6f1e7; }
  svg.graph .n.on rect { fill: #f3e4d8; stroke: #9a3412; }
  svg.graph line { stroke: #c3b9a6; }
  svg.graph line.on { stroke: #9a3412; stroke-width: 2; }
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; }
  .card h3 { font-family: var(--serif); font-size: 18px; font-weight: 500; }
  .tag { font-size: 12px; color: var(--accent); }
  .remember { margin-top: 8px; color: var(--ink); }
  .pit { margin-top: 8px; color: var(--muted); font-size: 13px; }
  .acc { border-top: 1px solid var(--line); }

  .acc.open .body { display: block; }
  .stars { color: var(--gold); letter-spacing: 0.05em; font-size: 12px; }
  .hidden { display: none !important; }
  .result-item { padding: 10px 0; border-bottom: 1px solid var(--line); }
  .app.with-clips { grid-template-columns: 220px minmax(0, 1fr) 280px; }
  .clips {
    position: sticky; top: 0; height: 100vh; overflow: auto;

  .clips h2 { margin: 0; font-size: 20px; }
  .clip-empty { margin: 0; color: var(--muted); font-size: 13px; }
  .clip-list { display: flex; flex-direction: column; gap: 8px; }
  .clip { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; }
  .clip p { margin: 4px 0 0; font-size: 13px; white-space: pre-wrap; display: -webkit-box; -webkit-line-clamp: 6; -webkit-box-orient: vertical; overflow: hidden; }
  .clip-meta { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; color: var(--muted); font-size: 12px; }
  .clip-jump { display: block; width: 100%; text-align: left; background: transparent; border: 0; padding: 0; font-weight: 600; }
  .clip-del { border: 0; background: transparent; color: var(--muted); padding: 0; }
  @media (max-width: 960px) {
    .app, .app.with-clips { grid-template-columns: 1fr; }
    aside, .clips { position: relative; height: auto; border-right: 0; border-left: 0; border-bottom: 1px solid var(--line); }
    nav { flex-direction: row; flex-wrap: wrap; }
    main { padding: 20px 16px 48px; }
    header.top, .formula, .grid-2, .grid-3, .map-wrap { grid-template-columns: 1fr; display: grid; }
    .wing.right { text-align: left; }
    input[type="search"] { width: 100%; }
  }
</style>
</head>

function esc(s) {
  return String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function slug(text) {
  return text.replace(/\s*\{[^}]*\}\s*$/g, "").toLowerCase().trim()
    .replace(/[\u2000-\u206F\u2E00-\u2E7F\\'!"#$%&()*+,./:;<=>?@[\]^`{|}~]/g, "")
    .replace(/\s/g, "-");
}
function href(file, heading) {
  return "book/" + file + ".md#" + encodeURIComponent(slug(heading));
}
function plainHeading(heading) {
  return heading.replace(/\s*\{[^}]*\}\s*$/g, "");

function sourceLink(file, heading) {
  return `<a class="src" href="${href(file, heading)}">原文 · ${esc(plainHeading(heading))}</a>`;

function branchIds(node, acc) {
  if (!node.children || !node.children.length) return acc;
  acc.push(node.id);
  node.children.forEach(child => branchIds(child, acc));
  return acc;
}
function nodeLink(node) {
  if (node.heading) return sourceLink(node.file, node.heading);
  if (node.file) return `<a class="src" href="book/${node.file}.md">原文 · 第 ${node.ch} 章</a>`;
  return "";
}
function renderBranch(node, depth) {
  const kids = node.children || [];
  const open = kids.length > 0 && openTree.has(node.id);
  const attrs = `data-tree="${esc(node.id)}"${node.ch ? ` data-ch="${node.ch}"` : ""}`;
  const title = kids.length
    ? `<button type="button" class="ktitle" ${attrs}><strong>${esc(node.title)}</strong>${node.note ? `<span>${esc(node.note)}</span>` : ""}</button>`
    : `<div class="ktitle"><strong>${esc(node.title)}</strong></div>`;
  const fold = kids.length
    ? `<button type="button" class="kfold" ${attrs} aria-expanded="${open ? "true" : "false"}">${open ? "−" : kids.length}</button>`
    : "";
  const sub = open ? `<ul>${kids.map(child => `<li>${renderBranch(child, depth + 1)}</li>`).join("")}</ul>` : "";
  return `<div class="kbranch d${Math.min(depth, 4)}"><div class="knode"><div class="kbody">${title}${nodeLink(node)}</div>${fold}</div>${sub}</div>`;
}

    return `<line x1="${A.x + A.w / 2}" y1="${A.y + A.h / 2}" x2="${B.x + B.w / 2}" y2="${B.y + B.h / 2}" class="${on ? "on" : ""}"/>`;
  }).join("");
  const nodes = NODES.map(n => `
    <g class="n ${n.core ? "core" : ""} ${n.id === selectedNode ? "on" : ""}" data-node="${n.id}">
      <rect x="${n.x}" y="${n.y}" width="${n.w}" height="${n.h}" rx="8"/>
      <text x="${n.x + n.w / 2}" y="${n.y + 23}" text-anchor="middle">${esc(n.label)}</text>
    </g>`).join("");
  const cur = nodeById(selectedNode);
  const related = EDGES.filter(e => e.includes(selectedNode)).map(e => e[0] === selectedNode ? e[1] : e[0]);
  return `
    <svg class="graph" viewBox="0 0 1040 520">${lines}${nodes}</svg>
    <div class="panel detail">
      <div class="k">当前概念</div>
      <h3>${esc(cur.label)}</h3>
      <p>${esc(cur.text)}</p>
      <p class="pit">相连：${related.map(id => esc(nodeById(id).label)).join("、")}</p>
    </div>`;
}

function renderCards() {
  const chips = [`<button class="chip" data-filter="0" aria-pressed="${chapterFilter === 0}">全部</button>`]
    .concat(CHAPTERS.map(c => `<button class="chip" data-filter="${c.id}" aria-pressed="${chapterFilter === c.id}">${c.id} ${esc(c.title)}</button>`))
    .concat(`<button class="chip" data-filter="-1" aria-pressed="${chapterFilter === -1}">后记</button>`);
  const list = CARDS.filter(c => chapterFilter === 0 || (chapterFilter === -1 ? c[0] === 0 : c[0] === chapterFilter));
  return `
    <div class="chips" style="margin-bottom:14px">${chips.join("")}</div>
    <div class="cards">${list.map(c => `
      <article class="panel card">
        <div class="tag">${c[0] === 0 ? "后记" : "第 " + c[0] + " 章"}</div>
        <h3>${esc(c[1])}</h3>
        <p>${esc(c[2])}</p>
        <p class="remember"><strong>记住</strong>　${esc(c[3])}</p>
        <p class="pit"><strong>易错</strong>　${esc(c[4])}</p>
        ${sourceLink(c[5], c[6])}
      </article>`).join("")}</div>`;
}

function renderChapters() {
  return `<div class="panel">${CHAPTERS.map(c => `
    <div class="acc ${c.id === openChapter ? "open" : ""}">
      <button class="row" data-ch="${c.id}"><span><strong>${c.id}. ${esc(c.title)}</strong> · ${esc(c.line)}</span><span>${c.id === openChapter ? "收起" : "展开"}</span></button>
      <div class="body"><ul class="clean">${c.points.map(p => `<li>${esc(p[0])} ${sourceLink(p[1], p[2])}</li>`).join("")}</ul></div>
    </div>`).join("")}</div>
    <p class="pit" style="margin-top:12px">更完整的树在 <a href="docs/脑图.md">docs/脑图.md</a>，卡片正文在 <a href="docs/知识卡片.md">docs/知识卡片.md</a>。</p>`;
}

function renderInterview() {
  return `<div class="panel">${QA.map((item, i) => `
    <div class="acc ${openQa.has(i) ? "open" : ""}">
      <button class="row" data-qa="${i}"><span>${esc(item[1])}</span><span class="stars">${esc(item[0])}</span></button>
      <div class="body">${esc(item[2])}${sourceLink(item[3], item[4])}</div>
    </div>`).join("")}</div>`;
}

function treeHits(node, ancestors, q, out) {
  const path = ancestors.concat(node);
  const blob = [node.title, node.note || "", node.heading || "", node.part || ""].join(" ");
  if (node.file && blob.toLowerCase().includes(q)) out.push(path);
  (node.children || []).forEach(child => treeHits(child, path, q, out));
  return out;
}
function renderSearch(q) {
  const s = q.toLowerCase();
  const hits = treeHits(TREE, [], s, []);
  const cards = CARDS.filter(c => c.join(" ").toLowerCase().includes(s));
  const qas = QA.filter(item => item.join(" ").toLowerCase().includes(s));
  if (!hits.length && !cards.length && !qas.length) return `<div class="panel">没有匹配「${esc(q)}」。试试：缓存、Pass、Skill、护栏、RL。</div>`;
  return `
    <h2>知识树</h2>
    ${hits.map(path => {
      const node = path[path.length - 1];
      const crumb = path.slice(0, -1).map(n => esc(n.title)).join(" / ");
      return `<div class="result-item">${crumb ? `<div class="k">${crumb}</div>` : ""}<strong>${esc(node.title)}</strong>${node.note ? ` · ${esc(node.note)}` : ""}${nodeLink(node)}</div>`;
    }).join("") || `<p class="pit">无</p>`}
    <h2>卡片</h2>
    <div class="cards">${cards.map(c => `<article class="panel card"><div class="tag">${c[0] === 0 ? "后记" : "第 " + c[0] + " 章"}</div><h3>${esc(c[1])}</h3><p>${esc(c[2])}</p><p class="remember">${esc(c[3])}</p>${sourceLink(c[5], c[6])}</article>`).join("") || `<p class="pit">无</p>`}</div>
    <h2>面试</h2>
    ${qas.map(item => `<div class="result-item"><div class="stars">${esc(item[0])}</div><strong>${esc(item[1])}</strong><p>${esc(item[2])}</p>${sourceLink(item[3], item[4])}</div>`).join("") || `<p class="pit">无</p>`}`;
}

function bind() {
  document.querySelectorAll("[data-tree-cmd]").forEach(el => el.addEventListener("click", () => {
    openTree.clear();
    if (el.dataset.treeCmd === "all") branchIds(TREE, []).forEach(id => openTree.add(id));
    else openTree.add("root");
    render();
  }));
  document.querySelectorAll("[data-tree]").forEach(el => el.addEventListener("click", () => {
    const id = el.dataset.tree;
    const opening = !openTree.has(id);
    if (opening) openTree.add(id); else openTree.delete(id);
    if (opening && el.dataset.ch) {
      openChapter = Number(el.dataset.ch);
      saveChapter(openChapter);
    }
    render();
  }));
  document.querySelectorAll("[data-ch]").forEach(el => el.addEventListener("click", () => {
    if (el.dataset.tree) return;
    openChapter = Number(el.dataset.ch);
    saveChapter(openChapter);
    render();
  }));
  document.querySelectorAll("[data-filter]").forEach(el => el.addEventListener("click", () => {
    chapterFilter = Number(el.dataset.filter);
    render();
  }));
  document.querySelectorAll("[data-node]").forEach(el => el.addEventListener("click", () => {
    selectedNode = el.dataset.node;
    render();
  }));
  document.querySelectorAll("[data-qa]").forEach(el => el.addEventListener("click", () => {
    const i = Number(el.dataset.qa);
    openQa.has(i) ? openQa.delete(i) : openQa.add(i);
    render();
  }));
}

document.getElementById("nav").addEventListener("click", (e) => {
  const btn = e.target.closest("button");
  if (!btn) return;
  view = btn.dataset.view;
  document.getElementById("q").value = "";
  render();
});
document.getElementById("q").addEventListener("input", render);

let clipReady = false;
let clips = [];
let dbPromise = null;
let clipChain = Promise.resolve();

function idbSupported() {
  try { return typeof indexedDB === "object" && indexedDB !== null; }
  catch (e) { return false; }
}
function usableText(text) {
  const t = String(text).replace(/\s+/g, " ").trim();
  if (t.length < 2 || !/[\p{L}\p{N}]/u.test(t)) return "";
  return t.length > 800 ? t.slice(0, 800) + "…" : t;
}
function selectionText() {
  const sel = window.getSelection();
  if (!sel || sel.isCollapsed || !sel.rangeCount) return "";
  const node = sel.anchorNode;
  const el = node && (node.nodeType === 1 ? node : node.parentElement);
  if (!el || !el.closest("main") || el.closest("button, input, textarea, aside")) return "";
  return usableText(sel.toString());
}
function clipTime(ts) {
  const d = new Date(ts);
  const hm = d.toLocaleTimeString("zh-CN", { hour: "2-digit", minute: "2-digit" });
  return d.toDateString() === new Date().toDateString() ? hm : (d.getMonth() + 1) + "/" + d.getDate() + " " + hm;
}
function paintClips() {
  const root = document.getElementById("clips");
  const list = document.getElementById("clip-list");
  const status = document.getElementById("clip-status");
  if (!clipReady) {
    root.classList.add("hidden");
    document.querySelector(".app").classList.remove("with-clips");
    return;
  }
  root.classList.remove("hidden");
  document.querySelector(".app").classList.add("with-clips");
  status.textContent = clips.length ? clips.length + " 条，只保存在这台浏览器" : "点一章，或选中一段文字。";
  list.innerHTML = clips.map(c => `
    <article class="clip">
      ${c.kind === "chapter"
        ? `<button type="button" class="clip-jump" data-open-chapter="${c.chapterId}">${esc(c.title)}</button>`
        : `<div class="k">划词 · ${esc(c.title)}</div>`}
      <p>${esc(c.text)}</p>
      <div class="clip-meta"><time>${esc(clipTime(c.createdAt))}</time><button type="button" class="clip-del" data-clip-del="${c.id}">删除</button></div>
    </article>`).join("");
  root.scrollTop = 0;
}
function readClips() {
  return dbPromise.then(db => new Promise((resolve, reject) => {
    const req = db.transaction("clips", "readonly").objectStore("clips").getAll();
    req.onsuccess = () => resolve(req.result.sort((a, b) => b.createdAt - a.createdAt));
    req.onerror = () => reject(req.error);
  }));
}
function enqueueClip(clip) {
  clipChain = clipChain.then(() => putClip(clip)).catch(() => {});
}
function putClip(clip) {
  const existing = clips.find(c => c.kind === clip.kind && (clip.kind === "chapter" ? c.chapterId === clip.chapterId : c.text === clip.text));
  const record = Object.assign({}, clip, { createdAt: Date.now() });
  if (existing) record.id = existing.id;
  return dbPromise.then(db => new Promise((resolve, reject) => {
    const tx = db.transaction("clips", "readwrite");
    tx.objectStore("clips").put(record);
    tx.oncomplete = resolve;
    tx.onerror = () => reject(tx.error);
  })).then(readClips).then(rows => { clips = rows; paintClips(); });
}
function saveChapter(id) {
  if (!clipReady) return;
  const ch = CHAPTERS.find(c => c.id === id);
  if (!ch) return;
  enqueueClip({
    kind: "chapter",
    chapterId: ch.id,
    title: "第 " + ch.id + " 章 · " + ch.title,
    text: [ch.line].concat(ch.points.map(p => p[0])).join("\n"),
    view: view
  });
}
function saveText(text) {
  if (!clipReady || !text) return;
  enqueueClip({ kind: "text", chapterId: 0, title: VIEWS[view][0], text: text, view: view });
}
function removeClip(id) {
  clipChain = clipChain.then(() => dbPromise.then(db => new Promise((resolve, reject) => {
    const tx = db.transaction("clips", "readwrite");
    tx.objectStore("clips").delete(id);
    tx.oncomplete = resolve;
    tx.onerror = () => reject(tx.error);
  })).then(readClips).then(rows => { clips = rows; paintClips(); })).catch(() => {});
}
function initClips() {
  if (!idbSupported()) return;
  dbPromise = new Promise((resolve, reject) => {
    let req;
    try { req = indexedDB.open("ai-agent-mindmap", 1); }
    catch (e) { reject(e); return; }
    req.onupgradeneeded = () => {
      const db = req.result;
      if (!db.objectStoreNames.contains("clips")) db.createObjectStore("clips", { keyPath: "id", autoIncrement: true });
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
  dbPromise.then(readClips).then(rows => {
    clipReady = true;
    clips = rows;
    paintClips();
    const hint = document.createElement("p");
    hint.textContent = "点一章或选中正文，会记在右侧。";
    document.querySelector(".side-note").appendChild(hint);
  }).catch(() => { clipReady = false; paintClips(); });
}
document.addEventListener("mouseup", () => { const text = selectionText(); if (text) saveText(text); });
document.addEventListener("keyup", (e) => {
  if (e.key !== "Shift" && !e.key.startsWith("Arrow")) return;
  const text = selectionText();
  if (text) saveText(text);
});
document.addEventListener("click", (e) => {
  const sel = window.getSelection();
  if (!clipReady || !sel || sel.isCollapsed) return;
  if (e.target.closest("main a")) { e.preventDefault(); e.stopPropagation(); }
}, true);
document.getElementById("clips").addEventListener("click", (e) => {
  const del = e.target.closest("[data-clip-del]");
  if (del) { removeClip(Number(del.dataset.clipDel)); return; }
  const open = e.target.closest("[data-open-chapter]");
  if (!open) return;
  openChapter = Number(open.dataset.openChapter);
  view = "map";
  document.getElementById("q").value = "";
  render();
});

function inlineMd(text) {
  const re = /!\[([^\]]*)\]\(([^)\s]+)(?:\s+"[^"]*")?\)|\[([^\]]+)\]\(([^)\s]+)\)|\*\*([^*]+)\*\*|`([^`]+)`/g;
  const parts = [];
  let last = 0;
  let m;
  while ((m = re.exec(text))) {
    parts.push(esc(text.slice(last, m.index)));
    if (m[0].startsWith("!")) {
      const url = /^(https?:|data:)/.test(m[2]) ? m[2] : "book/" + m[2].replace(/^\.\//, "");
      parts.push(`<img alt="${esc(m[1])}" src="${esc(url)}">`);
    } else if (m[4]) parts.push(`<a href="${esc(m[4])}">${esc(m[3])}</a>`);
    else if (m[5]) parts.push(`<strong>${inlineMd(m[5])}</strong>`);
    else if (m[6]) parts.push(`<code>${esc(m[6])}</code>`);
    last = m.index + m[0].length;
  }
  parts.push(esc(text.slice(last)));
  return parts.join("");
}
function renderMarkdown(md) {
  const lines = String(md).replace(/\r\n/g, "\n").split("\n");
  const out = [];
  let i = 0;
  while (i < lines.length) {
    const line = lines[i];
    if (!line.trim()) { i++; continue; }
    if (line.startsWith("```")) {
      const buf = [];
      i++;
      while (i < lines.length && !lines[i].startsWith("```")) buf.push(lines[i++]);
      if (i < lines.length) i++;
      out.push(`<pre><code>${esc(buf.join("\n"))}</code></pre>`);
      continue;
    }
    const heading = /^(#{1,6})\s+(.+)$/.exec(line);
    if (heading) {
      const level = heading[1].length;
      out.push(`<h${level} id="${esc(slug(heading[2]))}">${inlineMd(plainHeading(heading[2]))}</h${level}>`);
      i++;
      continue;
    }
    if (line.startsWith("|") && i + 1 < lines.length && /^\|?\s*:?-{3,}/.test(lines[i + 1])) {
      const rows = [];
      while (i < lines.length && lines[i].startsWith("|")) rows.push(lines[i++]);
      const cells = (row) => row.replace(/^\|/, "").replace(/\|$/, "").split("|").map(cell => cell.trim());
      const head = cells(rows[0]);
      const body = rows.slice(2).map(cells);
      out.push(`<table><thead><tr>${head.map(cell => `<th>${inlineMd(cell)}</th>`).join("")}</tr></thead><tbody>${body.map(row => `<tr>${row.map(cell => `<td>${inlineMd(cell)}</td>`).join("")}</tr>`).join("")}</tbody></table>`);
      continue;
    }
    if (line.startsWith(">")) {
      const buf = [];
      while (i < lines.length && lines[i].startsWith(">")) buf.push(lines[i++].replace(/^>\s?/, ""));
      out.push(`<blockquote>${renderMarkdown(buf.join("\n"))}</blockquote>`);
      continue;
    }
    if (/^\s*[-*]\s+/.test(line)) {
      const items = [];
      while (i < lines.length && /^\s*[-*]\s+/.test(lines[i])) items.push(lines[i++].replace(/^\s*[-*]\s+/, ""));
      out.push(`<ul>${items.map(item => `<li>${inlineMd(item)}</li>`).join("")}</ul>`);
      continue;
    }
    if (/^\s*\d+\.\s+/.test(line)) {
      const items = [];
      while (i < lines.length && /^\s*\d+\.\s+/.test(lines[i])) items.push(lines[i++].replace(/^\s*\d+\.\s+/, ""));
      out.push(`<ol>${items.map(item => `<li>${inlineMd(item)}</li>`).join("")}</ol>`);
      continue;
    }
    if (/^---+$/.test(line.trim())) { out.push("<hr>"); i++; continue; }
    const buf = [line];
    i++;
    while (i < lines.length && lines[i].trim() && !/^(#{1,6}\s|```|\||>|\s*[-*]\s+|\s*\d+\.\s+)/.test(lines[i]) && !/^---+$/.test(lines[i].trim())) buf.push(lines[i++]);
    out.push(`<p>${inlineMd(buf.join(" "))}</p>`);
  }
  return out.join("\n");
}
const previewHtml = new Map();
let bookLoader = null;
function ensureBook() {
  if (window.BOOK) return Promise.resolve();
  if (!bookLoader) {
    bookLoader = new Promise((resolve, reject) => {
      const script = document.createElement("script");
      script.src = "preview/book.js";
      script.onload = () => window.BOOK ? resolve() : reject(new Error("empty"));
      script.onerror = () => reject(new Error("load"));
      document.body.appendChild(script);
    });
  }
  return bookLoader;
}
function closePreview() {
  document.getElementById("preview").classList.add("hidden");
}
function openPreview(file, id) {
  const root = document.getElementById("preview");
  const body = document.getElementById("preview-body");
  const note = document.getElementById("preview-note");
  root.classList.remove("hidden");
  document.getElementById("preview-title").textContent = "原文";
  note.textContent = "正在打开原文…";
  body.innerHTML = "";
  ensureBook().then(() => {
    const md = window.BOOK[file];
    if (!md) { note.textContent = "没有找到这一章。"; return; }
    if (!previewHtml.has(file)) previewHtml.set(file, renderMarkdown(md));
    body.innerHTML = previewHtml.get(file);
    const heading = id ? body.querySelector("#" + CSS.escape(id)) : body.querySelector("h1, h2, h3");
    note.textContent = "";
    if (!heading) { note.textContent = "没有对上这一节，已从章首打开。"; return; }
    document.getElementById("preview-title").textContent = heading.textContent;
    heading.classList.add("hit");
    heading.scrollIntoView({ block: "start" });
  }).catch(() => { note.textContent = "原文没有载入。请确认 preview/book.js 和本页在同一目录下打开。"; });
}
document.getElementById("preview-close").addEventListener("click", closePreview);
document.getElementById("preview").addEventListener("click", (e) => { if (e.target.id === "preview") closePreview(); });
document.addEventListener("keydown", (e) => { if (e.key === "Escape") closePreview(); });
document.addEventListener("click", (e) => {
  const link = e.target.closest("a[href]");
  if (!link) return;
  const match = (link.getAttribute("href") || "").match(/^book\/([A-Za-z0-9_-]+)\.md(?:#(.*))?$/);
  if (!match) return;
  e.preventDefault();
  e.stopPropagation();
  openPreview(match[1], match[2] ? decodeURIComponent(match[2]) : "");
}, true);

render();
initClips();
</script>
